<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector - Infocivil Ebook</title>
  <script src="/vendor/pdfjs/build/pdf.mjs" type="module"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      overflow: hidden;
    }
    
    .book-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      perspective: 2000px;
    }
    
    .book {
      display: flex;
      width: 100%;
      max-width: 1200px;
      height: 85vh;
      position: relative;
      transform-style: preserve-3d;
    }
    
    .page {
      flex: 1;
      background: white;
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
      overflow: hidden;
      position: relative;
    }
    
    .page-left {
      border-radius: 8px 0 0 8px;
    }
    
    .page-right {
      border-radius: 0 8px 8px 0;
    }
    
    .page canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
    }
    
    .controls {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      background: rgba(255,255,255,0.95);
      padding: 16px 24px;
      border-radius: 50px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      z-index: 1000;
    }
    
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-primary {
      background: #2b6cb0;
      color: white;
    }
    
    .btn-primary:hover {
      background: #2c5282;
      transform: translateY(-2px);
    }
    
    .btn-secondary {
      background: #edf2f7;
      color: #2d3748;
    }
    
    .btn-secondary:hover {
      background: #e2e8f0;
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .page-info {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.95);
      padding: 12px 24px;
      border-radius: 50px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      font-weight: 600;
      color: #2d3748;
      z-index: 1000;
    }
    
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
      font-size: 18px;
      z-index: 999;
    }
    
    .loading::after {
      content: '';
      display: block;
      width: 40px;
      height: 40px;
      margin: 20px auto;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @media (max-width: 768px) {
      .book { flex-direction: column; height: 75vh; }
      .page-left, .page-right { border-radius: 8px; margin-bottom: 10px; }
      .page-right { margin-bottom: 0; }
      .controls { bottom: 20px; padding: 12px 16px; }
      .btn { padding: 10px 16px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">Cargando libro...</div>
  
  <div class="page-info" id="pageInfo" style="display: none;">
    Página <span id="currentPage">1</span> de <span id="totalPages">-</span>
  </div>
  
  <div class="book-container">
    <div class="book">
      <div class="page page-left">
        <canvas id="canvasLeft"></canvas>
      </div>
      <div class="page page-right">
        <canvas id="canvasRight"></canvas>
      </div>
    </div>
  </div>
  
  <div class="controls">
    <button class="btn btn-secondary" id="btnFirst" title="Primera página">⏮</button>
    <button class="btn btn-primary" id="btnPrev">← Anterior</button>
    <button class="btn btn-primary" id="btnNext">Siguiente →</button>
    <button class="btn btn-secondary" id="btnLast" title="Última página">⏭</button>
    <button class="btn btn-secondary" id="btnBack">← Volver</button>
  </div>

  <script type="module">
    import * as pdfjsLib from '/vendor/pdfjs/build/pdf.mjs';
    
    const params = new URLSearchParams(location.search);
    const cid = params.get('cid');
    const nroActuacion = params.get('n');
    
    if (!cid || !nroActuacion) {
      alert('Faltan parámetros');
      window.location.href = '/';
    }
    
    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 0;
    const scale = 1.5;
    
    const canvasLeft = document.getElementById('canvasLeft');
    const canvasRight = document.getElementById('canvasRight');
    const ctxLeft = canvasLeft.getContext('2d');
    const ctxRight = canvasRight.getContext('2d');
    
    async function loadPDF() {
      try {
        const res = await fetch(`/api/expediente/${cid}/documento/${nroActuacion}`);
        if (!res.ok) throw new Error('Documento no disponible');
        
        const blob = await res.blob();
        const arrayBuffer = await blob.arrayBuffer();
        pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        
        totalPages = pdfDoc.numPages;
        document.getElementById('totalPages').textContent = totalPages;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('pageInfo').style.display = 'block';
        
        renderPages();
      } catch (err) {
        document.getElementById('loading').textContent = 'Error: ' + err.message;
      }
    }
    
    async function renderPages() {
      if (!pdfDoc) return;
      
      // Ajustar tamaño de canvas
      const page = await pdfDoc.getPage(currentPage);
      const viewport = page.getViewport({ scale });
      
      canvasLeft.width = viewport.width;
      canvasLeft.height = viewport.height;
      canvasRight.width = viewport.width;
      canvasRight.height = viewport.height;
      
      // Renderizar página actual
      await page.render({ canvasContext: ctxLeft, viewport }).promise;
      
      // Renderizar página siguiente si existe
      if (currentPage + 1 <= totalPages) {
        const nextPage = await pdfDoc.getPage(currentPage + 1);
        await nextPage.render({ canvasContext: ctxRight, viewport }).promise;
      } else {
        ctxRight.clearRect(0, 0, canvasRight.width, canvasRight.height);
      }
      
      document.getElementById('currentPage').textContent = currentPage;
      
      // Actualizar estado de botones
      document.getElementById('btnPrev').disabled = currentPage === 1;
      document.getElementById('btnNext').disabled = currentPage >= totalPages;
    }
    
    // Controles
    document.getElementById('btnPrev').addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage -= 2;
        if (currentPage < 1) currentPage = 1;
        renderPages();
      }
    });
    
    document.getElementById('btnNext').addEventListener('click', () => {
      if (currentPage < totalPages) {
        currentPage += 2;
        if (currentPage > totalPages) currentPage = totalPages;
        renderPages();
      }
    });
    
    document.getElementById('btnFirst').addEventListener('click', () => {
      currentPage = 1;
      renderPages();
    });
    
    document.getElementById('btnLast').addEventListener('click', () => {
      currentPage = totalPages % 2 === 0 ? totalPages - 1 : totalPages;
      renderPages();
    });
    
    document.getElementById('btnBack').addEventListener('click', () => {
      window.location.href = `/leer.html?cid=${cid}`;
    });
    
    // Navegación con teclado
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        document.getElementById('btnPrev').click();
      } else if (e.key === 'ArrowRight') {
        document.getElementById('btnNext').click();
      } else if (e.key === 'Home') {
        document.getElementById('btnFirst').click();
      } else if (e.key === 'End') {
        document.getElementById('btnLast').click();
      }
    });
    
    // Inicializar
    loadPDF();
  </script>
</body>
</html>
