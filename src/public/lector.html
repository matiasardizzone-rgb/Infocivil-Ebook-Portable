<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Infocivil · Lector</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --azul:#0b3d91; --azul2:#1e5bbf; --gris:#f4f6fa; --tinta:#222; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, Segoe UI, Roboto, sans-serif; background:var(--gris); color:var(--tinta); }
  header { background:var(--azul); color:#fff; padding:10px 18px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:50; }
  header h1 { margin:0; font-size:16px; font-weight:600; white-space:nowrap; }
  header .caratula { flex:1; opacity:.85; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  header button, header a { background:var(--azul2); color:#fff; border:0; padding:6px 12px; border-radius:6px; cursor:pointer; font-weight:600; text-decoration:none; font-size:12px; }
  header button.activo { background:#fff; color:var(--azul); }
  #barra { background:#fff; border-bottom:1px solid #dde; padding:6px 18px; display:flex; align-items:center; gap:10px; position:sticky; top:44px; z-index:40; }
  #barra button { background:#e8edf7; border:1px solid #c6d2ea; border-radius:6px; padding:4px 10px; cursor:pointer; }
  #barra .pag { font-size:12px; color:#556; }
  #barra .hint { font-size:11px; color:#99a; margin-left:auto; }
  main { display:flex; height:calc(100vh - 90px); }
  #indice { width:280px; background:#fff; border-right:1px solid #dde; overflow-y:auto; padding:10px; display:none; }
  #indice.abierto { display:block; }
  #indice h3 { margin:4px 6px 8px; font-size:13px; color:var(--azul); }
  #indice .item { padding:6px 8px; border-radius:6px; cursor:pointer; font-size:12px; }
  #indice .item:hover { background:#eef2fb; }
  #indice .item .n { font-weight:700; color:var(--azul2); }
  #indice .item .f { color:#889; font-size:11px; }
  #indice .item.nodisp { opacity:.5; }
  #zona { flex:1; overflow:auto; position:relative; }
  #libro { display:flex; align-items:center; justify-content:center; gap:6px; height:100%; perspective:2200px; }
  .hoja { background:#fff; box-shadow:0 2px 14px rgba(0,0,0,.18); position:relative; }
  .hoja canvas { display:block; }
  #hojaIzq { transform-origin:right center; border-radius:6px 0 0 6px; }
  #hojaDer { transform-origin:left center; border-radius:0 6px 6px 0; }
  .flip-out-der { animation: foutDer .18s ease-in forwards; }
  .flip-in-der  { animation: finDer  .18s ease-out; }
  .flip-out-izq { animation: foutIzq .18s ease-in forwards; }
  .flip-in-izq  { animation: finIzq  .18s ease-out; }
  @keyframes foutDer { to { transform:rotateY(-88deg); } }
  @keyframes finDer  { from { transform:rotateY(88deg); } }
  @keyframes foutIzq { to { transform:rotateY(88deg); } }
  @keyframes finIzq  { from { transform:rotateY(-88deg); } }
  /* Capa de texto seleccionable (permite copiar caracteres) */
  .textLayer { position:absolute; inset:0; overflow:hidden; line-height:1; transform-origin:0 0; z-index:3; }
  .textLayer :is(span,br) { position:absolute; transform-origin:0 0; }
  .textLayer span { display:inline-block; color:transparent; white-space:pre; cursor:text; }
  .textLayer ::selection { background:rgba(30,91,191,.35); }
  /* Enlace público visible y clicable al pie de cada página */
  .linkPub { position:absolute; bottom:3px; left:0; width:100%; text-align:center; font-size:10px;
             color:#3355aa; text-decoration:none; z-index:4; background:rgba(255,255,255,.8); padding:1px 0; }
  .linkPub:hover { text-decoration:underline; }
  .flag { position:absolute; top:8px; right:-14px; width:26px; height:34px; cursor:pointer; z-index:5;
          background:linear-gradient(#e8b422,#d19c0d); clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);
          box-shadow:0 1px 4px rgba(0,0,0,.35); }
  .flag.izq { right:auto; left:-14px; }
  .flag .tag { position:absolute; top:4px; left:0; width:100%; text-align:center; font-size:9px; font-weight:800; color:#5a4300; }
  #continuo { display:none; flex-direction:column; align-items:center; gap:14px; padding:18px 0 60px; }
  #continuo .slot { background:#fff; box-shadow:0 2px 10px rgba(0,0,0,.15); position:relative; }
  #continuo .slot canvas { display:block; }
  body.modo-continuo #libro { display:none; }
  body.modo-continuo #continuo { display:flex; }
  #panelBm { position:fixed; right:0; top:90px; width:300px; background:#fff; border:1px solid #dde; border-right:0;
             border-radius:10px 0 0 10px; box-shadow:0 4px 18px rgba(0,0,0,.15); padding:12px; display:none; z-index:60; max-height:70vh; overflow-y:auto; }
  #panelBm.abierto { display:block; }
  #panelBm h3 { margin:0 0 8px; font-size:13px; color:var(--azul); }
  #panelBm .bm { border:1px solid #e4e8f2; border-radius:8px; padding:8px; margin-bottom:8px; font-size:12px; }
  #panelBm .bm .tag { display:inline-block; background:#e8b422; color:#5a4300; font-weight:800; border-radius:4px; padding:1px 6px; font-size:10px; }
  #panelBm .bm button { font-size:11px; margin-top:6px; margin-right:6px; cursor:pointer; }
  #formBm { border-top:1px solid #e4e8f2; padding-top:8px; }
  #formBm input, #formBm textarea { width:100%; margin-bottom:6px; padding:6px; border:1px solid #ccd; border-radius:6px; font:inherit; font-size:12px; }
  #overlay { position:fixed; inset:0; background:rgba(244,246,250,.92); display:flex; align-items:center; justify-content:center; z-index:100; font-size:15px; color:var(--azul); font-weight:600; padding:0 20px; text-align:center; }
  #overlay.oculto { display:none; }
</style>
</head>
<body>
<header>
  <h1>Infocivil · Lector</h1>
  <span class="caratula" id="caratula"></span>
  <button id="btnModo">Modo continuo</button>
  <button id="btnIndice">Índice</button>
  <button id="btnBm">Banderitas</button>
  <a href="/">Consulta</a>
</header>
<div id="barra">
  <button id="btnAnt">◀ Ant</button>
  <span class="pag" id="pag"></span>
  <button id="btnSig">Sig ▶</button>
  <button id="btnMarcar">🔖 Marcar esta página</button>
  <span class="hint">El texto es seleccionable: arrastrá y Ctrl+C para copiar.</span>
</div>
<main>
  <aside id="indice"><h3>Índice de actuaciones</h3><div id="listaIndice"></div></aside>
  <div id="zona">
    <div id="libro">
      <div class="hoja" id="hojaIzq"><canvas id="cvIzq"></canvas></div>
      <div class="hoja" id="hojaDer"><canvas id="cvDer"></canvas></div>
    </div>
    <div id="continuo"></div>
  </div>
</main>
<div id="panelBm">
  <h3>Banderitas del expediente</h3>
  <div id="listaBm"></div>
  <div id="formBm">
    <input id="bmTag" placeholder="Tag (ej: DEMANDA, PRUEBA…)" maxlength="12">
    <textarea id="bmNota" rows="2" placeholder="Nota…"></textarea>
    <button id="bmGuardar">Guardar banderita</button>
  </div>
</div>
<div id="overlay">Cargando expediente…</div>

<script type="module">
import * as pdfjsLib from '/vendor/pdfjs/build/pdf.mjs';
import { renderTextLayer } from '/vendor/pdfjs/build/pdf.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = '/vendor/pdfjs/build/pdf.worker.mjs';

const $ = s => document.querySelector(s);
const cid = new URLSearchParams(location.search).get('cid');
const overlay = $('#overlay');

let timerOverlay = null;
function mostrar(t) {
  overlay.classList.remove('oculto');
  const t0 = Date.now();
  overlay.textContent = t;
  clearInterval(timerOverlay);
  timerOverlay = setInterval(() => {
    const s = Math.round((Date.now() - t0) / 1000);
    overlay.textContent = `${t} (${s}s) — si es la primera vez que abrís este expediente, ` +
      `se están descargando todos sus PDFs del SCW; el progreso aparece en la terminal del servidor.`;
  }, 1000);
}
function ocultarOverlay() {
  clearInterval(timerOverlay);
  overlay.classList.add('oculto');
}

let manifest = null, pageMap = [], spread = 0, anim = false, modo = 'libro';
const docs = new Map();
const wait = ms => new Promise(r => setTimeout(r, ms));

function bmKey() { return 'infocivil-bm-' + manifest.id; }
function leerBm() { try { return JSON.parse(localStorage.getItem(bmKey())) || []; } catch { return []; } }
function guardarBm(list) { localStorage.setItem(bmKey(), JSON.stringify(list)); }

async function getDoc(file) {
  if (!docs.has(file)) docs.set(file, pdfjsLib.getDocument(`/expedientes/${manifest.id}/${file}`).promise);
  return docs.get(file);
}

// Canvas + capa de texto seleccionable + enlace público al pie
async function renderEn(canvas, entry, maxH, maxW) {
  const hoja = canvas.parentElement;
  const doc = await getDoc(entry.file);
  const page = await doc.getPage(entry.page);
  const vp1 = page.getViewport({ scale: 1 });
  const scale = Math.min(maxH / vp1.height, maxW / vp1.width);
  const vp = page.getViewport({ scale });
  canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
  hoja.style.width = canvas.width + 'px';
  hoja.style.height = canvas.height + 'px';
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;

  let tl = hoja.querySelector('.textLayer');
  if (!tl) { tl = document.createElement('div'); tl.className = 'textLayer'; hoja.appendChild(tl); }
  tl.innerHTML = '';
  try {
    const tc = await page.getTextContent();
    const task = renderTextLayer({ textContentSource: tc, container: tl, viewport: vp });
    await task.promise;
  } catch (e) { console.warn('[lector] capa de texto:', e.message); }

  let ln = hoja.querySelector('.linkPub');
  if (!ln) {
    ln = document.createElement('a'); ln.className = 'linkPub';
    ln.target = '_blank'; ln.rel = 'noopener'; hoja.appendChild(ln);
  }
  ln.href = entry.act.urlPublica || '#';
  ln.textContent = `Act. ${String(entry.act.numero).padStart(3,'0')} · ${entry.act.tipo || ''} ${entry.act.fecha || ''} · fuente SCW ↗`;
}

function dims() {
  const zona = $('#zona').getBoundingClientRect();
  return { maxH: zona.height - 40, maxW: (zona.width - 60) / 2 };
}

function pintarFlags() {
  document.querySelectorAll('.flag').forEach(f => f.remove());
  const bms = leerBm();
  const pagIzq = spread * 2, pagDer = spread * 2 + 1;
  for (const bm of bms) {
    const idx = bm.pagina - 1;
    if (idx === pagDer) agregarFlag($('#hojaDer'), bm, false);
    else if (idx === pagIzq) agregarFlag($('#hojaIzq'), bm, true);
  }
}
function agregarFlag(hoja, bm, izq) {
  const d = document.createElement('div');
  d.className = 'flag' + (izq ? ' izq' : '');
  d.title = `${bm.tag || ''} — ${bm.nota || ''} (pág. ${bm.pagina})`;
  d.innerHTML = `<span class="tag">${(bm.tag || '').slice(0,3).toUpperCase()}</span>`;
  d.onclick = () => { $('#panelBm').classList.add('abierto'); pintarListaBm(); };
  hoja.appendChild(d);
}

async function pintarSpread() {
  const { maxH, maxW } = dims();
  const i = spread * 2, j = i + 1;
  if (pageMap[i]) { $('#hojaIzq').style.visibility='visible'; await renderEn($('#cvIzq'), pageMap[i], maxH, maxW); }
  else { $('#hojaIzq').style.visibility='hidden'; }
  if (pageMap[j]) { $('#hojaDer').style.visibility='visible'; await renderEn($('#cvDer'), pageMap[j], maxH, maxW); }
  else { $('#hojaDer').style.visibility='hidden'; }
  $('#pag').textContent = `pág. ${i + 1}${pageMap[j] ? '–' + (j + 1) : ''} de ${pageMap.length}`;
  pintarFlags();
}

async function irSpread(s, dir) {
  const max = Math.ceil(pageMap.length / 2) - 1;
  s = Math.max(0, Math.min(s, max));
  if (s === spread || anim) return;
  anim = true;
  const hoja = dir > 0 ? $('#hojaDer') : $('#hojaIzq');
  hoja.classList.add(dir > 0 ? 'flip-out-der' : 'flip-out-izq');
  await wait(180);
  spread = s; await pintarSpread();
  hoja.classList.remove('flip-out-der', 'flip-out-izq');
  hoja.classList.add(dir > 0 ? 'flip-in-der' : 'flip-in-izq');
  await wait(180);
  hoja.classList.remove('flip-in-der', 'flip-in-izq');
  anim = false;
}

let obs = null;
function armarContinuo() {
  const cont = $('#continuo');
  cont.innerHTML = '';
  const { maxW } = dims();
  const ancho = Math.min(maxW * 1.6, 900);
  pageMap.forEach((entry, idx) => {
    const slot = document.createElement('div');
    slot.className = 'slot'; slot.dataset.idx = idx;
    slot.style.width = ancho + 'px'; slot.style.height = Math.floor(ancho * 841.89 / 595.28) + 'px';
    const cv = document.createElement('canvas'); slot.appendChild(cv);
    cont.appendChild(slot);
  });
  obs = new IntersectionObserver(entries => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      const slot = e.target; obs.unobserve(slot);
      const idx = Number(slot.dataset.idx);
      renderEn(slot.querySelector('canvas'), pageMap[idx], slot.clientHeight, slot.clientWidth)
        .catch(err => console.error('[lector] render continuo:', err.message));
    }
  }, { root: $('#zona'), rootMargin: '300px' });
  cont.querySelectorAll('.slot').forEach(s => obs.observe(s));
}
function saltarAPagina(idx) {
  if (modo === 'libro') irSpread(Math.floor(idx / 2), 1);
  else $('#continuo').children[idx]?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function armarIndice() {
  const lista = $('#listaIndice'); lista.innerHTML = '';
  let cursor = 0;
  for (const act of manifest.actuaciones) {
    const inicio = cursor;
    if (act.archivo && act.paginas) cursor += act.paginas;
    const d = document.createElement('div');
    d.className = 'item' + (act.archivo ? '' : ' nodisp');
    d.innerHTML = `<span class="n">${String(act.numero).padStart(3,'0')}</span> ${act.tipo || ''} <span class="f">${act.fecha || ''}${act.archivo ? ' · pág. ' + (inicio + 1) : ' · no disponible'}</span>`;
    d.onclick = () => saltarAPagina(inicio);
    lista.appendChild(d);
  }
}

function pintarListaBm() {
  const lista = $('#listaBm'); lista.innerHTML = '';
  for (const bm of leerBm()) {
    const d = document.createElement('div'); d.className = 'bm';
    d.innerHTML = `<span class="tag">${bm.tag || 'S/T'}</span> pág. ${bm.pagina}<br>${bm.nota || ''}`;
    const ir = document.createElement('button'); ir.textContent = 'Ir';
    ir.onclick = () => saltarAPagina(bm.pagina - 1);
    const del = document.createElement('button'); del.textContent = 'Quitar';
    del.onclick = () => { guardarBm(leerBm().filter(x => x.ts !== bm.ts)); pintarListaBm(); pintarFlags(); };
    d.appendChild(ir); d.appendChild(del);
    lista.appendChild(d);
  }
}
$('#btnMarcar').onclick = () => {
  const pagina = spread * 2 + 2;
  $('#bmTag').dataset.pagina = pagina;
  $('#panelBm').classList.add('abierto'); pintarListaBm();
  $('#bmTag').focus();
};
$('#bmGuardar').onclick = () => {
  const pagina = Number($('#bmTag').dataset.pagina || (spread * 2 + 2));
  const list = leerBm();
  list.push({ pagina, tag: $('#bmTag').value.trim(), nota: $('#bmNota').value.trim(), ts: Date.now() });
  guardarBm(list);
  $('#bmTag').value = ''; $('#bmNota').value = '';
  pintarListaBm(); pintarFlags();
};

$('#btnModo').onclick = () => {
  modo = modo === 'libro' ? 'continuo' : 'libro';
  document.body.classList.toggle('modo-continuo', modo === 'continuo');
  $('#btnModo').textContent = modo === 'libro' ? 'Modo continuo' : 'Modo libro';
  $('#btnModo').classList.toggle('activo', modo === 'continuo');
  if (modo === 'continuo' && !$('#continuo').children.length) armarContinuo();
};
$('#btnIndice').onclick = () => $('#indice').classList.toggle('abierto');
$('#btnBm').onclick = () => { $('#panelBm').classList.toggle('abierto'); pintarListaBm(); };
$('#btnAnt').onclick = () => irSpread(spread - 1, -1);
$('#btnSig').onclick = () => irSpread(spread + 1, 1);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') irSpread(spread + 1, 1);
  if (e.key === 'ArrowLeft') irSpread(spread - 1, -1);
});
window.addEventListener('resize', () => { if (modo === 'libro') pintarSpread(); });

(async function init() {
  if (!cid) { mostrar('Falta el cid: entrá desde la consulta o desde Mis Expedientes.'); return; }
  try {
    mostrar('Cargando expediente…');
    const r = await fetch(`/api/expediente/${cid}/leer`);
    if (!r.ok) throw new Error((await r.json()).error || 'HTTP ' + r.status);
    manifest = await r.json();
    pageMap = [];
    for (const act of manifest.actuaciones) {
      if (!act.archivo || !act.paginas) continue;
      for (let p = 1; p <= act.paginas; p++) pageMap.push({ file: act.archivo, page: p, act });
    }
    if (!pageMap.length) { mostrar('El expediente no tiene documentos disponibles para leer.'); return; }
    $('#caratula').textContent = `${manifest.id} — ${manifest.caratula || ''}`;
    document.title = `Infocivil · ${manifest.id}`;
    armarIndice();
    await pintarSpread();
    ocultarOverlay();
  } catch (e) {
    mostrar('Error: ' + e.message);
    console.error('[lector]', e);
  }
})();
</script>
</body>
</html>
