<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expediente — Infocivil Ebook</title>
<link rel="stylesheet" href="/estilos.css">
</head>
<body>

<header class="barra">
  <div class="barra-contenido">
    <svg class="escudo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <path d="M12 3v18M7 7h10M5 7l-2.5 6a3.5 3.5 0 0 0 5 0L5 7zM19 7l-2.5 6a3.5 3.5 0 0 0 5 0L19 7z"/>
      <path d="M8 21h8"/>
    </svg>
    <div>
      <div class="barra-titulo">Infocivil Ebook</div>
      <div class="barra-sub">Poder Judicial de la Nación · Cámara Civil</div>
    </div>
    <div class="barra-acciones">
      <a class="barra-link" href="/mis-expedientes.html">Mis expedientes</a>
      <a class="barra-link" href="/">Nueva consulta</a>
    </div>
  </div>
</header>

<main class="ancho">
  <div id="cargando" class="cargando-exp">Leyendo el expediente en el SCW… esto puede demorar un minuto en expedientes grandes.</div>

  <div id="contenido" hidden>
    <div class="exp-cabecera">
      <div class="exp-id" id="expId"></div>
      <h1 class="exp-caratula" id="expCaratula"></h1>
      <div class="exp-meta" id="expMeta"></div>
    </div>

    <div id="avisos"></div>

    <section id="seccionVinculados" hidden>
      <h2 class="seccion-titulo">Incidentes y expedientes vinculados</h2>
      <div id="listaVinculados"></div>
    </section>

    <div class="acciones">
      <button class="accion accion--destacada" id="btnEbook">
        <svg class="accion-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        <span class="accion-titulo">Leer como libro</span>
        <span class="accion-desc">Dos páginas enfrentadas y paso de hoja, como el expediente en papel. Para hojear y ubicarse.</span>
      </button>

      <button class="accion accion--destacada" id="btnContinua">
        <svg class="accion-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <rect x="5" y="2" width="14" height="9" rx="1"/>
          <rect x="5" y="13" width="14" height="9" rx="1"/>
          <path d="M12 11.5v1.5"/>
        </svg>
        <span class="accion-titulo">Lectura continua</span>
        <span class="accion-desc">Todas las actuaciones una debajo de otra, con scroll. Para leer de corrido.</span>
      </button>

      <button class="accion" data-formato="unificado-indice">
        <svg class="accion-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/>
          <path d="M8 13h8M8 17h5"/>
        </svg>
        <span class="accion-titulo">PDF unificado con índice</span>
        <span class="accion-desc">Con portada, índice hipervinculado y el enlace público del SCW al pie de cada página.</span>
      </button>

      <button class="accion" data-formato="unificado">
        <svg class="accion-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/>
        </svg>
        <span class="accion-titulo">PDF unificado</span>
        <span class="accion-desc">Un solo PDF con todo el expediente, sin índice ni enlaces. Para remitir a otra jurisdicción.</span>
      </button>

      <button class="accion" data-formato="zip">
        <svg class="accion-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <path d="M21 8v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6l2 3h6a2 2 0 0 1 2 2z"/>
          <path d="M12 11v5M10 13h4"/>
        </svg>
        <span class="accion-titulo">Descargar ZIP</span>
        <span class="accion-desc">Cada actuación como PDF separado, con su firma electrónica intacta y verificable.</span>
      </button>
    </div>

    <div class="guardar-fila">
      <button class="boton-secundario" id="btnGuardar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" class="boton-icono">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
        <span id="btnGuardarTexto">Guardar en Mis expedientes</span>
      </button>
    </div>

    <div id="estado" class="estado" role="status" aria-live="polite"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const cid = params.get('cid');
const sessionId = params.get('sessionId');
const jurisdiccion = params.get('jurisdiccion') || '';
const numero = params.get('numero') || '';
const anio = params.get('anio') || '';

const estado = $('estado');
function mostrarEstado(texto, tipo) {
  estado.textContent = texto || '';
  estado.className = 'estado' + (tipo ? ' estado--' + tipo : '');
}

if (!cid || !sessionId) {
  location.href = '/';
}

let datosExpediente = null;

async function cargarExpediente() {
  try {
    const r = await fetch(`/api/expediente/${encodeURIComponent(cid)}/actuaciones?sessionId=${encodeURIComponent(sessionId)}`);
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'No se pudieron leer las actuaciones.');
    datosExpediente = d;

    $('expId').textContent = `${jurisdiccion} ${numero}/${anio}`;
    $('expCaratula').textContent = d.caratula || `Expediente ${cid}`;
    $('expMeta').textContent = `${d.actuaciones.length} actuaciones`;

    const avisos = [];
    if (d.paginacionIncompleta) {
      avisos.push('El recorrido de páginas se cortó antes de tiempo (demora del sistema). Pueden faltar actuaciones más viejas. Conviene volver a consultar el expediente.');
    }
    if (d.historicasEstado === 'timeout') {
      avisos.push('No se pudo determinar si este expediente tiene actuaciones históricas.');
    }
    $('avisos').innerHTML = avisos.map(a => `<div class="aviso">${a}</div>`).join('');

    $('cargando').hidden = true;
    $('contenido').hidden = false;
    actualizarBotonGuardar();
    avisarNovedades(d.actuaciones.length);

    // Los vinculados se piden DESPUÉS de las actuaciones, no en paralelo:
    // ambas operaciones usan la misma pestaña del navegador del lado del
    // servidor, y lanzarlas juntas hacía que una navegación cancelara a la
    // otra (ERR_ABORTED).
    cargarVinculados();
  } catch (e) {
    $('cargando').textContent = e.message + ' — Probá hacer una nueva consulta.';
  }
}
cargarExpediente();

// ─── Novedades desde la última visita ───────────────────────────────
// Los expedientes guardados anotan cuántas actuaciones tenían la última vez
// que se los vio. Al volver a abrirlos se compara contra la cantidad actual
// y se avisa si hubo movimiento. La marca se actualiza en el momento, así
// el aviso no se repite en la visita siguiente.
function avisarNovedades(cantidadActual) {
  const lista = leerGuardados();
  const guardado = lista.find(e => e.clave === claveExpediente());
  if (!guardado) return; // no está en Mis expedientes: nada que comparar

  const previas = Number(guardado.cantidadActuaciones) || 0;
  const nuevas = cantidadActual - previas;

  if (nuevas > 0) {
    const cuando = guardado.vistoEl || guardado.guardadoEl;
    const desde = cuando ? ' desde tu última visita del ' + new Date(cuando).toLocaleDateString('es-AR') : '';
    const caja = document.createElement('div');
    caja.className = 'novedad';
    caja.textContent = nuevas === 1
      ? `Hay 1 actuación nueva${desde}.`
      : `Hay ${nuevas} actuaciones nuevas${desde}.`;
    $('avisos').prepend(caja);
  }

  // Se deja registrado lo visto ahora, aunque no haya habido cambios.
  guardado.cantidadActuaciones = cantidadActual;
  guardado.vistoEl = new Date().toISOString();
  escribirGuardados(lista);
}

// ─── Incidentes y vinculados ────────────────────────────────────────
// Se piden aparte de las actuaciones porque viven en otra solapa del SCW
// y tardan lo suyo: así la pantalla ya es usable mientras llegan.
async function cargarVinculados() {
  try {
    const r = await fetch(`/api/expediente/${encodeURIComponent(cid)}/vinculados?sessionId=${encodeURIComponent(sessionId)}`);
    const d = await r.json();
    if (!d.ok || !d.vinculados || !d.vinculados.length) return;

    $('seccionVinculados').hidden = false;
    $('listaVinculados').innerHTML = d.vinculados.map(v => `
      <div class="vinculado">
        <div class="vinculado-datos">
          <div class="vinculado-id">${escapar(v.expediente)}</div>
          <div class="vinculado-caratula">${escapar(v.caratula || '')}</div>
          <div class="vinculado-meta">${escapar([v.dependencia, v.situacion, v.ultimaActuacion ? 'últ. act. ' + v.ultimaActuacion : ''].filter(Boolean).join(' · '))}</div>
        </div>
        <button class="boton-secundario" data-abrir="${escapar(v.expediente)}">Abrir</button>
      </div>`).join('');

    $('listaVinculados').querySelectorAll('[data-abrir]').forEach(b => {
      b.addEventListener('click', () => abrirVinculado(b, b.dataset.abrir));
    });
  } catch {
    // Que falle la lectura de vinculados no debe estropear la pantalla:
    // el expediente principal sigue siendo perfectamente usable.
  }
}

async function abrirVinculado(boton, expediente) {
  boton.disabled = true;
  const textoOriginal = boton.textContent;
  boton.textContent = 'Abriendo…';
  mostrarEstado('Abriendo ' + expediente + '… puede demorar unos segundos.', 'cargando');
  try {
    const r = await fetch(`/api/expediente/${encodeURIComponent(cid)}/abrir-vinculado`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, expediente }),
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'No se pudo abrir el incidente.');

    // El incidente pasa a ser el expediente en pantalla: mismo lector,
    // mismas descargas. Se conserva número y año del principal y se agrega
    // el sufijo del incidente para mostrarlo bien.
    const sufijo = (expediente.match(/\/(\d+)\s*$/) || [])[1] || '';
    const p = new URLSearchParams({
      cid: d.cid, sessionId,
      jurisdiccion, numero, anio: anio + (sufijo ? '/' + sufijo : ''),
    });
    location.href = '/expediente.html?' + p.toString();
  } catch (e) {
    mostrarEstado(e.message, 'error');
    boton.disabled = false;
    boton.textContent = textoOriginal;
  }
}

function escapar(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}


// Las descargas se disparan navegando a la URL del endpoint: el servidor
// responde con Content-Disposition: attachment, así que el navegador la
// maneja como una descarga normal (con su propia barra de progreso, y sin
// cargar 70+ MB en memoria del lado de JS).
document.querySelectorAll('.accion[data-formato]').forEach(btn => {
  btn.addEventListener('click', () => {
    const formato = btn.dataset.formato;
    mostrarEstado('Preparando la descarga… el archivo puede tardar varios minutos en expedientes grandes. No cierres esta pestaña.', 'cargando');
    location.href = `/api/expediente/${encodeURIComponent(cid)}/descargar/${formato}?sessionId=${encodeURIComponent(sessionId)}`;
  });
});

$('btnEbook').addEventListener('click', () => {
  const p = new URLSearchParams({ cid, sessionId, jurisdiccion, numero, anio, modo: 'libro' });
  location.href = '/leer.html?' + p.toString();
});

$('btnContinua').addEventListener('click', () => {
  const p = new URLSearchParams({ cid, sessionId, jurisdiccion, numero, anio, modo: 'rollo' });
  location.href = '/leer.html?' + p.toString();
});

// ─── Mis expedientes ────────────────────────────────────────────────
// Guardado local en el navegador (localStorage), sin cuentas ni datos en
// el servidor. Se guarda la identificación del expediente y la cantidad de
// actuaciones vista, que es lo que permite detectar novedades más adelante:
// al reabrirlo se compara contra la cantidad actual. NO se guardan los
// documentos.
const CLAVE = 'infocivil.misExpedientes';

function leerGuardados() {
  try { return JSON.parse(localStorage.getItem(CLAVE) || '[]'); }
  catch { return []; }
}
function escribirGuardados(lista) {
  localStorage.setItem(CLAVE, JSON.stringify(lista));
}
function claveExpediente() {
  return `${jurisdiccion}|${numero}|${anio}`;
}
function estaGuardado() {
  return leerGuardados().some(e => e.clave === claveExpediente());
}

function actualizarBotonGuardar() {
  const guardado = estaGuardado();
  $('btnGuardarTexto').textContent = guardado ? 'Quitar de Mis expedientes' : 'Guardar en Mis expedientes';
  $('btnGuardar').classList.toggle('boton-secundario--activo', guardado);
}

$('btnGuardar').addEventListener('click', () => {
  let lista = leerGuardados();
  const clave = claveExpediente();

  if (estaGuardado()) {
    lista = lista.filter(e => e.clave !== clave);
    escribirGuardados(lista);
    mostrarEstado('Quitado de Mis expedientes.', 'ok');
  } else {
    lista.unshift({
      clave,
      jurisdiccion, numero, anio,
      caratula: (datosExpediente && datosExpediente.caratula) || '',
      cantidadActuaciones: (datosExpediente && datosExpediente.actuaciones.length) || 0,
      guardadoEl: new Date().toISOString(),
      // Punto de partida para comparar novedades en la próxima visita.
      vistoEl: new Date().toISOString(),
    });
    escribirGuardados(lista);
    mostrarEstado('Guardado en Mis expedientes (solo en este navegador).', 'ok');
  }
  actualizarBotonGuardar();
});
</script>
</body>
</html>
