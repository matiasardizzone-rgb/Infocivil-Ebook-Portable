<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lector — Infocivil Ebook</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }

  /* ── Header institucional ── */
  .hdr { height:56px; background:#14396b; color:#fff; display:flex; align-items:center; gap:14px; padding:0 16px; }
  .hdr .burger { width:36px; height:36px; border:none; border-radius:6px; background:rgba(255,255,255,.12); color:#fff; font-size:18px; cursor:pointer; }
  .hdr .tit { flex:1; min-width:0; }
  .hdr .tit .exp { font-size:.72rem; opacity:.85; }
  .hdr .tit h1 { font-size:.95rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hdr .right { display:flex; align-items:center; gap:16px; font-size:.85rem; white-space:nowrap; }
  .hdr .right a { color:#fff; text-decoration:none; font-weight:600; }

  /* ── Layout ── */
  .wrap { display:flex; height:calc(100% - 56px - 52px); }
  .side { width:300px; background:#f6f3ec; border-right:1px solid #ddd6c8; display:flex; flex-direction:column; }
  .side.hidden { display:none; }
  .side .search { padding:10px; }
  .side .search input { width:100%; padding:8px 10px; border:1px solid #cfc8b8; border-radius:6px; font-size:.85rem; background:#fff; }
  .side .list { flex:1; overflow-y:auto; padding:4px 8px 12px; }
  .item { padding:9px 10px; border-radius:6px; cursor:pointer; border-left:3px solid transparent; margin-bottom:4px; }
  .item:hover { background:#efe9dc; }
  .item.active { background:#e3ecf7; border-left-color:#2b6cb0; }
  .item h4 { font-size:.78rem; color:#14396b; text-transform:uppercase; letter-spacing:.02em; }
  .item p { font-size:.74rem; color:#4a5568; line-height:1.35; margin-top:2px;
             display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .item .f { font-size:.7rem; color:#8a8272; margin-top:3px; }

  /* ── Zona del libro ── */
  .bookzone { flex:1; background:#6b5d4c; position:relative; overflow:hidden; display:flex; }
  .spread { flex:1; display:flex; gap:2px; padding:10px 46px 10px 10px; perspective:2200px; }
  .pg { flex:1; background:#fdfbf4; display:flex; flex-direction:column; min-width:0;
        box-shadow:0 6px 22px rgba(0,0,0,.45); transform-origin:left center; }
  .pg.right { transform-origin:right center; }
  .pg.turn-next { animation:turnNext .28s ease; }
  .pg.turn-prev { animation:turnPrev .28s ease; }
  @keyframes turnNext { from { transform:rotateY(0); } 45% { transform:rotateY(-14deg); } to { transform:rotateY(0); } }
  @keyframes turnPrev { from { transform:rotateY(0); } 45% { transform:rotateY(14deg); } to { transform:rotateY(0); } }
  .pg .ph { padding:7px 12px; border-bottom:1px solid #e6dfcf; background:#fbf8ef; }
  .pg .ph .l1 { font-size:.72rem; font-weight:700; color:#3d3a33; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pg .ph .l2 { font-size:.68rem; color:#8a8272; margin-top:2px; }
  .pg .canvasbox { flex:1; overflow:auto; display:flex; justify-content:center; align-items:flex-start; background:#f4efe2; }
  .pg canvas { display:block; margin:8px auto; box-shadow:0 1px 6px rgba(0,0,0,.18); background:#fff; }
  .pg .pf { display:flex; align-items:center; gap:8px; padding:6px 10px; border-top:1px solid #e6dfcf; background:#fbf8ef; }
  .pg .pf a { flex:1; font-size:.66rem; color:#2b6cb0; text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pg .pf button { border:1px solid #cfc8b8; background:#fff; border-radius:5px; font-size:.66rem; padding:3px 10px; cursor:pointer; color:#4a5568; }
  .pg .pf button:hover { background:#efe9dc; }

  /* Banderitas */
  .flags { position:absolute; right:8px; top:10px; bottom:10px; width:34px; display:flex; flex-direction:column; gap:6px; align-items:center; overflow-y:auto; }
  .flagbtn { width:34px; height:34px; border-radius:50%; border:none; background:rgba(255,255,255,.9); cursor:pointer; font-size:15px; box-shadow:0 2px 8px rgba(0,0,0,.3); }
  .flagtab { width:26px; height:20px; border-radius:3px 3px 3px 0; cursor:pointer; position:relative;
             clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%); }
  .flagtab:hover::after { content:attr(data-nota); position:absolute; right:32px; top:0; width:190px; background:#14396b; color:#fff;
             font-size:.68rem; padding:6px 8px; border-radius:6px; white-space:normal; z-index:50; }

  /* ── Barra inferior ── */
  .bar { height:52px; background:#4a3f33; display:flex; align-items:center; justify-content:center; gap:14px; color:#efe9dc; }
  .bar button { border:none; cursor:pointer; border-radius:8px; background:rgba(255,255,255,.14); color:#efe9dc; }
  .bar .nav { width:38px; height:34px; font-size:16px; }
  .bar .nav:hover, .bar .tool:hover { background:rgba(255,255,255,.26); }
  .bar .tool { width:32px; height:30px; font-size:15px; }
  .bar .lbl { font-size:.85rem; min-width:90px; text-align:center; }
  .bar .zoomlbl { font-size:.78rem; background:rgba(255,255,255,.14); padding:6px 10px; border-radius:6px; min-width:52px; text-align:center; }
  .bar .sep { width:1px; height:24px; background:rgba(255,255,255,.25); }
  .bar .pill { padding:8px 16px; border-radius:8px; font-size:.82rem; font-weight:600; display:flex; align-items:center; gap:8px; }

  .overlay { position:absolute; inset:0; background:rgba(40,34,26,.82); color:#fff; display:flex; flex-direction:column;
             align-items:center; justify-content:center; gap:14px; z-index:40; font-size:.95rem; text-align:center; padding:20px; }
  .spin { width:38px; height:38px; border:4px solid rgba(255,255,255,.25); border-top-color:#fff; border-radius:50%; animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .overlay a { color:#9ecbff; }

  /* Modo lectura continua */
  .continuous { flex:1; overflow-y:auto; background:#6b5d4c; padding:16px; }
  .continuous .doc { background:#fdfbf4; margin:0 auto 18px; box-shadow:0 4px 16px rgba(0,0,0,.4); }
  .continuous .doc .ph { padding:8px 14px; border-bottom:1px solid #e6dfcf; font-size:.75rem; font-weight:700; color:#3d3a33; }
  .continuous canvas { display:block; width:100%; height:auto; }
</style>
</head>
<body>

<div class="hdr">
  <button class="burger" id="btnSide" title="Mostrar/ocultar índice">☰</button>
  <div class="tit">
    <div class="exp" id="hdrExp">—</div>
    <h1 id="hdrTitle">Cargando…</h1>
  </div>
  <div class="right">
    <span id="hdrAct">Actuación — de —</span>
    <a href="javascript:history.back()">Volver</a>
  </div>
</div>

<div class="wrap">
  <aside class="side" id="side">
    <div class="search"><input id="q" type="text" placeholder="Buscar en el índice…"></div>
    <div class="list" id="list"></div>
  </aside>

  <div class="bookzone" id="zone">
    <div class="spread" id="spread">
      <div class="pg" id="pgL">
        <div class="ph"><div class="l1" id="phL1">—</div><div class="l2" id="phL2">—</div></div>
        <div class="canvasbox"><canvas id="cvL"></canvas></div>
        <div class="pf"><a id="lkL" href="#" target="_blank" rel="noopener">—</a><button data-copy="L">Copiar</button></div>
      </div>
      <div class="pg right" id="pgR">
        <div class="ph"><div class="l1" id="phR1">—</div><div class="l2" id="phR2">—</div></div>
        <div class="canvasbox"><canvas id="cvR"></canvas></div>
        <div class="pf"><a id="lkR" href="#" target="_blank" rel="noopener">—</a><button data-copy="R">Copiar</button></div>
      </div>
    </div>
    <div class="flags" id="flags"><button class="flagbtn" id="btnFlag" title="Poner banderita en esta página">🚩</button></div>
    <div class="overlay" id="ov" style="display:none"><div class="spin"></div><div id="ovMsg">Abriendo documento…</div></div>
  </div>
</div>

<div class="bar">
  <button class="nav" id="bPrev">‹</button>
  <span class="lbl" id="lblHojas">Hoja —</span>
  <button class="nav" id="bNext">›</button>
  <span class="sep"></span>
  <button class="tool" id="bZoomOut">−</button>
  <span class="zoomlbl" id="lblZoom">100%</span>
  <button class="tool" id="bZoomIn">+</button>
  <button class="tool" id="bSpread" title="Una o dos páginas">📖</button>
  <span class="sep"></span>
  <button class="pill" id="bCont">📄 Lectura continua</button>
</div>

<script type="module">
import * as pdfjsLib from './vendor/pdfjs/build/pdf.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = './vendor/pdfjs/build/pdf.worker.mjs';

const q = new URLSearchParams(location.search);
const cid = q.get('cid');
if (!cid) { document.getElementById('ovMsg').textContent = 'Falta el cid.'; document.getElementById('ov').style.display = 'flex'; }

let acts = [], ai = 0, pdf = null, total = 0, cur = 1, zoom = 1, spread = 2, continuo = false;
const $ = id => document.getElementById(id);
const marcasKey = 'infocivil-marcas-' + cid;
const getMarcas = () => JSON.parse(localStorage.getItem(marcasKey) || '[]');
const setMarcas = m => localStorage.setItem(marcasKey, JSON.stringify(m));

function ov(show, msg) { $('ov').style.display = show ? 'flex' : 'none'; if (msg) $('ovMsg').textContent = msg; }

/* ── Índice ── */
async function init() {
  ov(true, 'Leyendo actuaciones del expediente…');
  const r = await fetch(`/api/expediente/${cid}/actuaciones`);
  const d = await r.json();
  if (!d.ok || !d.actuaciones || !d.actuaciones.length) {
    ov(true, 'No se pudieron leer las actuaciones. ' + (d.error || '') + '<br><a href="/">Volver</a>');
    $('ovMsg').innerHTML = 'No se pudieron leer las actuaciones. ' + (d.error || '') + '<br><a href="/">Volver</a>';
    return;
  }
  acts = d.actuaciones;
  $('hdrTitle').textContent = d.caratula || ('Expediente ' + cid);
  $('hdrExp').textContent = (q.get('jurisdiccion') || '') + ' ' + (q.get('numero') || '') + '/' + (q.get('anio') || '');
  pintarLista();
  ov(false);
  await abrir(parseInt(q.get('act') || '1', 10) || 1);
}

function pintarLista(filtro) {
  const l = $('list'); l.innerHTML = '';
  acts.forEach((a, i) => {
    if (filtro && !(a.tipo + ' ' + a.descripcion).toLowerCase().includes(filtro)) return;
    const el = document.createElement('div');
    el.className = 'item' + (i === ai ? ' active' : '');
    el.innerHTML = `<h4>${String(a.numero).padStart(3,'0')} ${a.tipo}</h4><p>${a.descripcion}</p><div class="f">${a.fecha}</div>`;
    el.onclick = () => abrir(a.numero);
    l.appendChild(el);
  });
}
$('q').oninput = e => pintarLista(e.target.value.toLowerCase());
$('btnSide').onclick = () => $('side').classList.toggle('hidden');

/* ── Abrir actuación ── */
async function abrir(numero) {
  const i = acts.findIndex(a => a.numero === numero);
  if (i < 0) return;
  ai = i; cur = 1;
  pintarLista($('q').value.toLowerCase());
  $('hdrAct').textContent = `Actuación ${acts[ai].numero} de ${acts.length}`;
  ov(true, `Descargando actuación ${numero}…<br><small>La primera vez baja del SCW; después queda en caché local.</small>`);
  try {
    const r = await fetch(`/api/expediente/${cid}/documento/${numero}`);
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'no disponible');
    const buf = await r.arrayBuffer();
    pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    total = pdf.numPages;
    ov(false);
    continuo ? modoContinuo() : render(false);
  } catch (e) {
    $('ovMsg').innerHTML = `No se pudo abrir el documento: ${e.message}<br>
      <a href="${acts[ai].urlPublica}" target="_blank" rel="noopener">🔗 Ver en el SCW</a> &nbsp;·&nbsp;
      <a href="javascript:location.reload()">Reintentar</a>`;
  }
  pintarFlags();
}

/* ── Render spread ── */
async function render(anim) {
  if (!pdf) return;
  const n = spread;
  const pags = [cur, cur + 1].slice(0, n).filter(p => p <= total);
  $('pgR').style.display = n === 2 ? 'flex' : 'none';
  if (anim) { const el = anim === 'next' ? $('pgR') : $('pgL'); el.classList.remove('turn-next','turn-prev'); void el.offsetWidth; el.classList.add(anim === 'next' ? 'turn-next' : 'turn-prev'); }

  const boxes = [document.querySelector('#pgL .canvasbox'), document.querySelector('#pgR .canvasbox')];
  const cvs = [$('cvL'), $('cvR')];
  const heads = [['phL1','phL2'], ['phR1','phR2']];
  const links = [$('lkL'), $('lkR')];

  for (let k = 0; k < 2; k++) {
    const p = pags[k];
    if (!p) { cvs[k].width = cvs[k].height = 1; $(heads[k][0]).textContent = ''; $(heads[k][1]).textContent = ''; links[k].textContent = ''; continue; }
    const page = await pdf.getPage(p);
    const base = page.getViewport({ scale: 1 });
    const alto = boxes[k].clientHeight - 20 || 900;
    const scale = (alto / base.height) * zoom;
    const vp = page.getViewport({ scale });
    cvs[k].width = vp.width; cvs[k].height = vp.height;
    await page.render({ canvasContext: cvs[k].getContext('2d'), viewport: vp }).promise;
    const a = acts[ai];
    $(heads[k][0]).textContent = `Act. ${a.numero} - ${a.tipo} — ${a.descripcion}`;
    $(heads[k][1]).textContent = `${a.fecha} · pág. ${p} de ${total}`;
    links[k].href = a.urlPublica; links[k].textContent = a.urlPublica;
  }
  $('lblHojas').textContent = n === 2 ? `Hoja ${pags[0]}–${pags[pags.length-1]}` : `Hoja ${pags[0]}`;
}

/* ── Navegación ── */
$('bNext').onclick = () => {
  if (cur + spread <= total) { cur += spread; render('next'); }
  else if (ai < acts.length - 1) abrir(acts[ai + 1].numero);
};
$('bPrev').onclick = () => {
  if (cur > 1) { cur = Math.max(1, cur - spread); render('prev'); }
  else if (ai > 0) abrir(acts[ai - 1].numero);
};
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') $('bNext').click();
  if (e.key === 'ArrowLeft') $('bPrev').click();
});

/* ── Zoom / spread ── */
$('bZoomIn').onclick  = () => { zoom = Math.min(3, zoom + .25); $('lblZoom').textContent = Math.round(zoom*100)+'%'; continuo ? modoContinuo() : render(false); };
$('bZoomOut').onclick = () => { zoom = Math.max(.5, zoom - .25); $('lblZoom').textContent = Math.round(zoom*100)+'%'; continuo ? modoContinuo() : render(false); };
$('bSpread').onclick  = () => { spread = spread === 2 ? 1 : 2; render(false); };

/* ── Copiar enlace público ── */
document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
  const url = (b.dataset.copy === 'L' ? $('lkL') : $('lkR')).href;
  await navigator.clipboard.writeText(url);
  b.textContent = '✓ Copiado'; setTimeout(() => b.textContent = 'Copiar', 1500);
});

/* ── Banderitas ── */
$('btnFlag').onclick = () => {
  const nota = prompt('Nota de la banderita (opcional tag con #):');
  if (nota === null) return;
  const m = getMarcas();
  m.push({ act: acts[ai].numero, pag: cur, nota, ts: Date.now() });
  setMarcas(m); pintarFlags();
};
function pintarFlags() {
  document.querySelectorAll('.flagtab').forEach(e => e.remove());
  getMarcas().filter(m => m.act === acts[ai]?.numero).forEach(m => {
    const t = document.createElement('div');
    t.className = 'flagtab'; t.style.background = '#e53e3e';
    t.dataset.nota = `pág. ${m.pag} — ${m.nota}`;
    t.title = m.nota;
    t.onclick = () => { cur = m.pag; render(false); };
    $('flags').appendChild(t);
  });
}

/* ── Lectura continua ── */
$('bCont').onclick = async () => {
  continuo = !continuo;
  $('bCont').innerHTML = continuo ? '📖 Volver al libro' : '📄 Lectura continua';
  if (!continuo) { $('zone').innerHTML = location.hash, location.reload(); return; }
  const zone = $('zone');
  zone.innerHTML = '<div class="continuous" id="cont"></div>';
  const c = $('cont');
  for (let p = 1; p <= total; p++) {
    const page = await pdf.getPage(p);
    const vp = page.getViewport({ scale: 1.4 * zoom });
    const doc = document.createElement('div'); doc.className = 'doc';
    doc.innerHTML = `<div class="ph">Act. ${acts[ai].numero} — pág. ${p} de ${total}</div>`;
    const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
    doc.appendChild(cv); c.appendChild(doc);
    await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
  }
};

init();
</script>
</body>
</html>
